name: G4 MIDI Independent Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-head-windows:
    name: g4-midi-head-windows
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "HEAD mismatch" }
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install and build core
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Install exact app dependencies
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Export SMF from fixture
        run: node apps/desktop/tests/export-fixture.mjs
      - name: Install independent Python MIDI parser
        run: python -m pip install --disable-pip-version-check mido==1.3.3
      - name: Check MIDI with independent Mido parser
        run: python apps/desktop/tests/verify-midi.py
      - name: Upload fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: g4-midi-fixture-head
          path: .ci/*
          retention-days: 7

  midi-merge-windows:
    name: g4-midi-merge-windows
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR merge candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "HEAD mismatch" }
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install and build core
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Install exact app dependencies
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Export SMF from fixture
        run: node apps/desktop/tests/export-fixture.mjs
      - name: Install independent Python MIDI parser
        run: python -m pip install --disable-pip-version-check mido==1.3.3
      - name: Check MIDI with independent Mido parser
        run: python apps/desktop/tests/verify-midi.py
      - name: Upload fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: g4-midi-fixture-merge
          path: .ci/*
          retention-days: 7
