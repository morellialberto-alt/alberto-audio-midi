name: G3 Application CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  head-windows:
    name: g3-head-windows
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify candidate SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "HEAD mismatch: $actual expected $env:EXPECTED_SHA" }
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  merge-windows:
    name: g3-merge-windows
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR merge candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify merge candidate SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Merge candidate mismatch: $actual expected $env:EXPECTED_SHA" }
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
