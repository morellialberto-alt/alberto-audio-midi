name: G4 Windows Desktop Packaging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-head-windows:
    name: g4-desktop-head-windows
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "SHA mismatch" }
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Build and test headless core
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - name: Resolve desktop dependency lock
        shell: pwsh
        run: |
          npm --prefix apps/desktop install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Lock resolution failed" }
          $changed = git status --porcelain -- apps/desktop/package-lock.json
          if (![string]::IsNullOrWhiteSpace($changed)) {
            Write-Output 'BEGIN_G4_DESKTOP_LOCK'
            $lock = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path 'apps/desktop/package-lock.json').Path))
            for ($i=0; $i -lt $lock.Length; $i+=2048) {
              Write-Output $lock.Substring($i,[Math]::Min(2048,$lock.Length-$i))
            }
            Write-Output 'END_G4_DESKTOP_LOCK'
          }
      - name: Install desktop dependency tree
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Stage compiled core
        run: node scripts/stage-desktop.cjs
      - name: Make portable Windows package and installer
        run: npm --prefix apps/desktop run make
      - name: Verify installer and ZIP artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem apps/desktop/out/make -File -Recurse
          if (!($artifacts | Where-Object { $_.Name -match 'Setup\\.exe$' })) { throw "Missing Windows installer" }
          if (!($artifacts | Where-Object { $_.Extension -eq '.zip' })) { throw "Missing portable ZIP" }
          $artifacts | Select-Object FullName,Length | Format-Table
      - name: Upload unsigned G4 Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: g4-desktop-head-windows
          path: apps/desktop/out/make/**
          retention-days: 3
          compression-level: 0
